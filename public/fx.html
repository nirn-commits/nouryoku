<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>エフェクト素材の確認</title>
  <style>
    body { background: #1b1828; color: #eee; font-family: sans-serif; margin: 16px; }
    canvas { max-width: 100%; height: auto; background: repeating-conic-gradient(#333 0 25%, #555 0 50%) 0 0 / 24px 24px; }
    .meta { color: #aaa; font-size: 13px; }
  </style>
</head>
<body>
  <h1>エフェクト素材の確認</h1>
  <p id="status" class="meta">読み込み中…</p>
  <p class="meta">枠と名前は、ゲームが各コマとして切り出す位置です（背景の抜け具合も確認できます）。ずれている場合は public/js/fx.js の ATLAS の座標を直してください（横幅1316pxのシート基準）。</p>
  <canvas id="c"></canvas>
  <script type="module">
    import { loadFxSheet, ATLAS, frameRect } from './js/fx.js';
    const sheet = await loadFxSheet();
    const st = document.getElementById('status');
    if (!sheet) {
      st.textContent = '素材が見つかりません。public/fx/effects.png を置くか、タイトル画面の「素材の画像を選ぶ…」から選んでください。';
    } else {
      st.textContent = `読み込み元：${sheet.source}／${sheet.w}×${sheet.h}px／倍率 ${sheet.scale.toFixed(3)}${sheet.keyed ? '／市松模様の背景を自動で抜きました' : ''}`;
      const cv = document.getElementById('c');
      cv.width = sheet.w; cv.height = sheet.h;
      const ctx = cv.getContext('2d');
      ctx.drawImage(sheet.canvas, 0, 0);
      ctx.font = `${Math.max(10, 12 * sheet.scale)}px sans-serif`;
      for (const [name, v] of Object.entries(ATLAS)) {
        const list = Array.isArray(v) ? v.map((r, i) => [`${name}[${i}]`, r]) : Object.entries(v).map(([k, r]) => [`${name}.${k}`, r]);
        for (const [label, r] of list) {
          const [x, y, w, h] = frameRect(sheet, r);
          ctx.strokeStyle = '#0f0'; ctx.lineWidth = 1;
          ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
          ctx.fillStyle = '#0f0';
          ctx.fillText(label, x + 3, y + 12 * sheet.scale);
        }
      }
    }
  </script>
</body>
</html>
